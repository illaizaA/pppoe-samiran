<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Teknisi - Monitoring JSS</title>
<style>body{font-family:system-ui,sans-serif;background:#eff6ff;color:#1e293b;margin:0;padding:24px;display:grid;place-items:center;min-height:85vh}main{background:white;padding:32px;border-radius:20px;box-shadow:0 10px 40px #1e3c7215;width:min(360px,85vw)}h1{color:#1e3c72;font-size:24px}label{display:block;margin:18px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #94a3b8;border-radius:8px;font-size:16px}button{background:#1e3c72;color:white;border:0;border-radius:8px;padding:12px 20px;font-size:16px;cursor:pointer}a{color:#1e3c72}p{line-height:1.6}[role=alert]{color:#b91c1c}</style></head>
<body><main><h1>Login teknisi</h1><p>Kelola perangkat penerima notifikasi Monitoring JSS.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Akun<input name="username" autocomplete="username" maxlength="100" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Masuk</button></form><p><a href="/notifications">Kembali ke notifikasi</a></p></main></body></html>
